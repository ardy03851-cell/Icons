<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#e9eef5"/>
<title>Beat Hop</title>
<style>
  :root{
    --ink:#33304a;
    --paper:#ffffff;
    --paper-2:#f6f8fc;
    --accent:#ff8a68;
    --accent-2:#ffb090;
    --mint:#7ed6ba;
    --sky:#8db8ea;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#e9eef5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;
    touch-action:none;
  }
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
  .screen{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:22px;pointer-events:auto;
    padding-top:calc(22px + env(safe-area-inset-top));
    padding-bottom:calc(22px + env(safe-area-inset-bottom));
  }
  .hidden{display:none !important;}

  .card{
    position:relative;
    background:var(--paper);
    border:3px solid var(--ink);
    border-radius:30px;
    padding:32px 30px 28px;
    box-shadow:0 10px 0 var(--ink), 0 18px 32px rgba(51,48,74,0.18);
    text-align:center;max-width:460px;width:100%;
  }
  .card::before{
    content:"";position:absolute;inset:5px;border-radius:24px;
    border:1px dashed rgba(51,48,74,0.12);pointer-events:none;
  }

  h1{
    font-size:42px;font-weight:900;letter-spacing:0.18em;color:#fff;
    -webkit-text-stroke:4px var(--ink);paint-order:stroke fill;
    text-shadow:0 6px 0 var(--ink), 0 10px 18px rgba(51,48,74,0.22);
    margin:4px 0 14px 0.18em;
  }
  h2{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:0.06em;margin-bottom:12px;}
  .sub{font-size:15px;line-height:1.5;color:#6b6a80;margin-bottom:24px;font-weight:500;}
  .hint{font-size:11.5px;color:#9a99ad;margin-top:20px;letter-spacing:0.14em;font-weight:700;text-transform:uppercase;}

  .btn{
    display:block;width:100%;padding:16px 20px;border-radius:18px;
    border:3px solid var(--ink);font-family:inherit;font-size:17px;font-weight:900;
    letter-spacing:0.08em;cursor:pointer;margin-bottom:14px;position:relative;
    transition:transform .09s cubic-bezier(.2,.7,.3,1), box-shadow .09s cubic-bezier(.2,.7,.3,1);
    -webkit-appearance:none;text-transform:uppercase;
  }
  .btn:last-child{margin-bottom:0;}
  .btn.primary{
    background:linear-gradient(180deg,var(--accent-2) 0%,var(--accent) 100%);
    color:#fff;text-shadow:0 2px 0 rgba(51,48,74,0.35);
    box-shadow:0 7px 0 var(--ink), 0 12px 22px rgba(255,122,89,0.28);
  }
  .btn.ghost{
    background:linear-gradient(180deg,#ffffff 0%,#eef1f8 100%);
    color:var(--ink);
    box-shadow:0 7px 0 var(--ink), 0 12px 22px rgba(51,48,74,0.14);
  }
  .btn:active{
    transform:translateY(6px);
    box-shadow:0 1px 0 var(--ink), 0 3px 8px rgba(51,48,74,0.22);
  }
  .btn.primary:active{box-shadow:0 1px 0 var(--ink), 0 3px 8px rgba(255,122,89,0.30);}
  #file{display:none;}

  .bar{
    width:100%;height:14px;border-radius:99px;background:#eef0f7;
    border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);
    overflow:hidden;margin:20px 0 18px;position:relative;
  }
  #barFill{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--mint),var(--sky));
    transition:width .3s cubic-bezier(.4,.6,.4,1);position:relative;
  }
  #barFill::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,0.35),transparent 55%);
    border-radius:99px;
  }

  #hud{position:absolute;inset:0;pointer-events:none;}
  #scoreBox{position:absolute;top:calc(16px + env(safe-area-inset-top));left:20px;text-align:left;}
  #score{
    font-size:38px;font-weight:900;color:#fff;letter-spacing:0.02em;
    -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
    text-shadow:0 5px 0 var(--ink), 0 8px 16px rgba(51,48,74,0.22);
    font-variant-numeric:tabular-nums;line-height:1;
  }
  #combo{
    font-size:13px;font-weight:900;color:var(--accent);letter-spacing:0.18em;
    height:18px;margin-top:8px;-webkit-text-stroke:2px var(--ink);
    paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);
    opacity:0;transition:opacity .2s;
  }
  #combo.on{opacity:1;}
  #bpmTag{
    position:absolute;top:calc(18px + env(safe-area-inset-top));right:20px;
    font-size:12px;font-weight:900;color:var(--ink);letter-spacing:0.16em;
    background:#fff;padding:7px 14px;border-radius:99px;
    border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);
  }

  #feedback{
    position:absolute;left:50%;top:28%;transform:translate(-50%,-50%) scale(0.6);
    font-size:34px;font-weight:900;letter-spacing:0.20em;opacity:0;
    pointer-events:none;white-space:nowrap;
    -webkit-text-stroke:4px var(--ink);paint-order:stroke fill;
    text-shadow:0 7px 0 var(--ink), 0 12px 20px rgba(51,48,74,0.22);
  }
  #feedback.show{animation:pop .6s cubic-bezier(.2,1.35,.4,1) forwards;}
  @keyframes pop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.55) rotate(-3deg);}
    22%{opacity:1;transform:translate(-50%,-50%) scale(1.14) rotate(1.5deg);}
    60%{opacity:1;transform:translate(-50%,-50%) scale(1.0) rotate(0deg);}
    100%{opacity:0;transform:translate(-50%,-64%) scale(0.98) rotate(0deg);}
  }
  .f-perfect{color:#ffd9c2;}
  .f-good{color:#bdf0dc;}
  .f-ok{color:#d5d3e4;}
  .f-miss{color:#d8d6e4;}

  #tapHint{
    position:absolute;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    font-size:12px;letter-spacing:0.26em;font-weight:900;color:var(--ink);
    background:rgba(255,255,255,0.85);padding:8px 16px;border-radius:99px;
    border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);
    animation:breathe 2.2s ease-in-out infinite;transition:opacity .8s ease;
  }
  @keyframes breathe{
    0%,100%{transform:translateX(-50%) translateY(0);}
    50%{transform:translateX(-50%) translateY(-3px);}
  }

  .bigScore{
    font-size:56px;font-weight:900;color:#fff;letter-spacing:0.01em;
    -webkit-text-stroke:4px var(--ink);paint-order:stroke fill;
    text-shadow:0 8px 0 var(--ink), 0 14px 22px rgba(51,48,74,0.22);
    margin:6px 0 8px;font-variant-numeric:tabular-nums;
  }
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 26px;}
  .stat{
    background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;
    padding:10px 6px 8px;box-shadow:0 4px 0 var(--ink);
    font-size:10px;letter-spacing:0.14em;font-weight:900;color:#8a89a0;
  }
  .stat b{
    display:block;font-size:22px;color:var(--ink);letter-spacing:0;
    margin-bottom:3px;font-variant-numeric:tabular-nums;
    text-shadow:0 2px 0 rgba(51,48,74,0.12);
  }
  .stat.wide{grid-column:span 3;}
  .stat.wide b{font-size:18px;}

  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 42%,
      rgba(0,0,0,0) 42%, rgba(70,80,120,0.16) 100%);
  }

  .dots::after{content:"";animation:dots 1.4s steps(4,end) infinite;}
  @keyframes dots{0%{content:"";}25%{content:".";}50%{content:"..";}75%{content:"...";}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div id="ui">
  <div id="hud" class="hidden">
    <div id="scoreBox">
      <div id="score">0</div>
      <div id="combo"></div>
    </div>
    <div id="bpmTag">—</div>
    <div id="feedback"></div>
    <div id="tapHint">Tap to the beat</div>
  </div>

  <div id="menu" class="screen">
    <div class="card">
      <h1>BEAT HOP</h1>
      <p class="sub">Drop in a song. It finds the beat,<br/>builds a floating path, and you hop along.</p>
      <label class="btn primary" for="file">Choose a song</label>
      <input id="file" type="file"
        accept="audio/*,.mp3,.m4a,.aac,.wav,.aif,.aiff,.ogg,.oga,.caf"/>
      <button class="btn ghost" id="demo">Play the demo</button>
      <p class="hint">Headphones recommended</p>
    </div>
  </div>

  <div id="loading" class="screen hidden">
    <div class="card">
      <h2 id="loadTitle" class="dots">Listening</h2>
      <div class="bar"><div id="barFill"></div></div>
      <p class="sub" id="loadSub" style="margin-bottom:0">Reading the rhythm</p>
    </div>
  </div>

  <div id="results" class="screen hidden">
    <div class="card">
      <h2>Nice run</h2>
      <div class="bigScore" id="rScore">0</div>
      <div class="stats" id="rStats"></div>
      <button class="btn primary" id="again">Play again</button>
      <button class="btn ghost" id="back">New song</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const menuEl = $('menu'), loadingEl = $('loading'), resultsEl = $('results');
const hudEl = $('hud'), scoreEl = $('score'), comboEl = $('combo');
const bpmTag = $('bpmTag'), feedbackEl = $('feedback');
const barFill = $('barFill'), loadTitle = $('loadTitle'), loadSub = $('loadSub');
const tapHint = $('tapHint'), fileInput = $('file');

const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

/* ============================================================
   THREE
   ============================================================ */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const BG = new THREE.Color(0xe9eef5);
const scene = new THREE.Scene();
scene.background = BG;
scene.fog = new THREE.Fog(BG, 26, 78);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(7.0, 6.4, 10.0);

scene.add(new THREE.HemisphereLight(0xffffff, 0xc4d6e8, 1.9));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.05);
keyLight.position.set(6, 14, 9); scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xffd8c0, 0.7);
rimLight.position.set(-9, 5, -8); scene.add(rimLight);

const gradData = new Uint8Array([104, 178, 255]);
const gradientMap = new THREE.DataTexture(gradData, 3, 1, THREE.RedFormat);
gradientMap.minFilter = THREE.NearestFilter;
gradientMap.magFilter = THREE.NearestFilter;
gradientMap.generateMipmaps = false;
gradientMap.needsUpdate = true;

const INK = 0x33304a;
const outlineMat = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });

/* ---- Ambient particles ---- */
const particleGroup = new THREE.Group();
scene.add(particleGroup);
const particles = [];
{
  const geo = new THREE.SphereGeometry(0.055, 8, 6);
  for (let i = 0; i < 40; i++) {
    const mat = new THREE.MeshBasicMaterial({
      color: 0xa8b4c8, transparent: true,
      opacity: 0.12 + Math.random() * 0.22, depthWrite: false
    });
    const p = new THREE.Mesh(geo, mat);
    p.position.set((Math.random() - 0.5) * 34, 2 + Math.random() * 14, -Math.random() * 70 + 12);
    p.userData.speed = 0.25 + Math.random() * 0.4;
    p.userData.phase = Math.random() * Math.PI * 2;
    p.userData.baseY = p.position.y;
    p.userData.amp   = 0.5 + Math.random() * 0.9;
    particleGroup.add(p);
    particles.push(p);
  }
}

/* ---- Tiles ---- */
const TILE_W = 1.78, TILE_H = 0.42, TILE_D = 1.78;
const TILE_POOL = 48;
const tileGeo = new THREE.BoxGeometry(TILE_W, TILE_H, TILE_D);
const tiles = [];
for (let i = 0; i < TILE_POOL; i++) {
  const mat = new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap });
  const m = new THREE.Mesh(tileGeo, mat);
  const o = new THREE.Mesh(tileGeo, outlineMat);
  o.scale.set((TILE_W + 0.085) / TILE_W, (TILE_H + 0.085) / TILE_H, (TILE_D + 0.085) / TILE_D);
  m.add(o);
  m.visible = false;
  m.userData.idx = -1;
  m.userData.spawn = 1;
  scene.add(m);
  tiles.push(m);
}

/* ---- Player ---- */
const PLAYER_R = 0.62;
const playerGroup = new THREE.Group();
const playerMesh = new THREE.Mesh(
  new THREE.OctahedronGeometry(PLAYER_R, 0),
  new THREE.MeshToonMaterial({ color: 0xff8a68, gradientMap })
);
const playerOutline = new THREE.Mesh(playerMesh.geometry, outlineMat);
playerOutline.scale.setScalar((PLAYER_R + 0.06) / PLAYER_R);
playerMesh.add(playerOutline);
playerGroup.add(playerMesh);
scene.add(playerGroup);

const shadowMesh = new THREE.Mesh(
  new THREE.CircleGeometry(0.68, 28),
  new THREE.MeshBasicMaterial({ color: INK, transparent: true, opacity: 0.17, depthWrite: false, side: THREE.DoubleSide })
);
shadowMesh.rotation.x = -Math.PI / 2;
scene.add(shadowMesh);

/* ---- Pulse rings ---- */
const ringGeo = new THREE.RingGeometry(0.72, 0.9, 44);
const rings = [];
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
    color: INK, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide
  }));
  m.rotation.x = -Math.PI / 2; m.visible = false;
  scene.add(m);
  rings.push({ mesh: m, life: -1 });
}
let ringCursor = 0;
function spawnRing(pos, strong) {
  const r = rings[ringCursor++ % rings.length];
  r.mesh.position.set(pos.x, pos.y + 0.24, pos.z);
  r.mesh.visible = true;
  r.life = 0;
  r.mesh.material.opacity = strong ? 0.62 : 0.30;
  r.mesh.scale.setScalar(0.55);
}

/* ---- Beat cue ring ---- */
const cueRing = new THREE.Mesh(
  new THREE.RingGeometry(0.62, 0.82, 52),
  new THREE.MeshBasicMaterial({ color: INK, transparent: true, opacity: 0.4, depthWrite: false, side: THREE.DoubleSide })
);
cueRing.rotation.x = -Math.PI / 2;
cueRing.visible = false;
scene.add(cueRing);

/* ============================================================
   AUDIO ENGINE  (fixed for iOS unlocking)
   ============================================================ */
let actx = null;

function createAudioContext() {
  if (actx) return actx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try {
    actx = new AC({ latencyHint: 'interactive' });
  } catch (e) {
    try { actx = new AC(); } catch (e2) { console.error('AudioContext failed', e2); return null; }
  }
  return actx;
}

/* Unlock audio on first user gesture — critical for iOS Safari */
let audioUnlocked = false;
async function unlockAudio() {
  const ctx = createAudioContext();
  if (!ctx) return;
  if (ctx.state === 'suspended') {
    try { await ctx.resume(); } catch (e) { console.warn('resume failed', e); }
  }
  if (!audioUnlocked) {
    // Play a tiny silent buffer to prove we can
    try {
      const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start(0);
      audioUnlocked = true;
    } catch (e) { /* silent */ }
  }
}

/* Ensure the context is truly running (awaits the resume promise) */
async function ensureRunning() {
  const ctx = createAudioContext();
  if (!ctx) return null;
  if (ctx.state !== 'running') {
    try { await ctx.resume(); } catch (e) { console.warn('resume', e); }
  }
  return ctx;
}

function blip(freq, gain, dur) {
  if (!actx || actx.state !== 'running') return;
  try {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, actx.currentTime);
    g.gain.linearRampToValueAtTime(gain, actx.currentTime + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start();
    o.stop(actx.currentTime + dur + 0.02);
  } catch (e) { /* ignore */ }
}

/* Register unlock handlers — try on every gesture until it works */
['touchstart','touchend','pointerdown','click','keydown'].forEach(ev => {
  document.addEventListener(ev, () => { unlockAudio(); }, { passive: true });
});

/* ============================================================
   BEAT ANALYSIS  (downsampled for iPad performance)
   ============================================================ */
const MAX_ANALYSIS_SECONDS = 260;
const ANALYSIS_SR = 11025;      // low SR is plenty for kick detection & 4x faster
const HOP = 128;                // ~11.6 ms frames @ 11025 → ~86 fps
const WIN = 512;                // ~46 ms window

function computeNovelty(data, sr) {
  const frames = Math.max(2, Math.floor((data.length - WIN) / HOP) + 1);
  const env = new Float32Array(frames);

  // RMS energy per frame
  for (let i = 0; i < frames; i++) {
    const o = i * HOP;
    let s = 0;
    for (let j = 0; j < WIN; j++) { const v = data[o + j]; s += v * v; }
    env[i] = Math.sqrt(s / WIN);
  }

  // Light smoothing
  const sm = new Float32Array(frames);
  for (let i = 0; i < frames; i++) {
    const a = env[Math.max(0, i - 1)];
    const b = env[i];
    const c = env[Math.min(frames - 1, i + 1)];
    sm[i] = (a + b + c) / 3;
  }

  // Positive first difference (onset strength)
  const nov = new Float32Array(frames);
  for (let i = 1; i < frames; i++) {
    const d = sm[i] - sm[i - 1];
    nov[i] = d > 0 ? d : 0;
  }

  // Normalize
  let mx = 0;
  for (let i = 0; i < frames; i++) if (nov[i] > mx) mx = nov[i];
  if (mx > 1e-7) for (let i = 0; i < frames; i++) nov[i] /= mx;

  return { nov, frames, fps: sr / HOP };
}

function estimateTempo(nov, frames, fps) {
  let bestBpm = 110, bestScore = -1;
  for (let bpm = 62; bpm <= 180; bpm += 0.5) {
    const lag = (60 / bpm) * fps;
    const li = Math.floor(lag);
    if (li < 4 || li > frames - 4) continue;
    const fr = lag - li;

    let sum = 0, cnt = 0;
    for (let i = 0; i + li + 1 < frames; i++) {
      const v = nov[i + li] * (1 - fr) + nov[i + li + 1] * fr;
      sum += nov[i] * v;
      cnt++;
    }
    let score = cnt > 0 ? sum / cnt : 0;

    // 2nd harmonic reinforces
    const lag2 = lag * 2, li2 = Math.floor(lag2);
    if (li2 < frames - 4) {
      const fr2 = lag2 - li2;
      let s2 = 0, c2 = 0;
      for (let i = 0; i + li2 + 1 < frames; i++) {
        const v = nov[i + li2] * (1 - fr2) + nov[i + li2 + 1] * fr2;
        s2 += nov[i] * v; c2++;
      }
      if (c2 > 0) score += 0.45 * (s2 / c2);
    }

    // Tempo prior near 118
    const l = Math.log2(bpm / 118);
    score *= Math.exp(-0.5 * l * l / 0.36);

    if (score > bestScore) { bestScore = score; bestBpm = bpm; }
  }
  return bestBpm;
}

function findPhase(nov, frames, fps, bpm) {
  const period = (60 / bpm) * fps;
  let bestPhase = 0, bestScore = -1;
  const STEPS = 96;
  for (let s = 0; s < STEPS; s++) {
    const phase = (s / STEPS) * period;
    let sum = 0, cnt = 0;
    for (let t = phase; t < frames - 1; t += period) {
      const i0 = t | 0;
      const fr = t - i0;
      const v = nov[i0] * (1 - fr) + nov[Math.min(frames - 1, i0 + 1)] * fr;
      sum += v; cnt++;
    }
    if (cnt < 4) continue;
    const sc = sum / cnt;
    if (sc > bestScore) { bestScore = sc; bestPhase = phase; }
  }
  return bestPhase / fps;
}

async function analyzeBuffer(buffer, onProgress) {
  const duration = Math.min(buffer.duration, MAX_ANALYSIS_SECONDS);

  onProgress(0.22, 'Filtering the low end…');
  await nextFrame();

  // Render lowpassed mono at reduced sample rate → 4x smaller & faster
  const off = new OfflineAudioContext(1, Math.ceil(duration * ANALYSIS_SR), ANALYSIS_SR);
  const src = off.createBufferSource();
  src.buffer = buffer;
  const lp = off.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 220; lp.Q.value = 0.7;
  const hp = off.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 28;
  src.connect(lp); lp.connect(hp); hp.connect(off.destination);
  src.start(0);

  let rendered;
  try {
    rendered = await off.startRendering();
  } catch (e) {
    console.warn('Offline render failed, falling back to raw data', e);
    // Fallback: use raw data directly (slower but works)
    const ch = buffer.getChannelData(0);
    const { nov, frames, fps } = computeNovelty(ch, buffer.sampleRate);
    const bpm = estimateTempo(nov, frames, fps);
    const phase = findPhase(nov, frames, fps, bpm);
    return { beats: buildGrid(phase, bpm, duration, nov, frames, fps), bpm: Math.round(bpm) };
  }

  onProgress(0.55, 'Hunting for onsets…');
  await nextFrame();

  const data = rendered.getChannelData(0);
  const { nov, frames, fps } = computeNovelty(data, ANALYSIS_SR);

  onProgress(0.78, 'Counting the tempo…');
  await nextFrame();

  let bpm = estimateTempo(nov, frames, fps);
  if (!isFinite(bpm) || bpm < 55 || bpm > 200) bpm = 110;

  const phase = findPhase(nov, frames, fps, bpm);

  const beats = buildGrid(phase, bpm, duration, nov, frames, fps);

  onProgress(1.0, 'Ready');
  await nextFrame();

  return { beats, bpm: Math.round(bpm) };
}

function buildGrid(phaseSec, bpm, duration, nov, frames, fps) {
  const period = 60 / bpm;
  const minT = 1.45;
  const maxT = duration - 1.25;
  const beats = [];
  let started = false;

  const LOOK = Math.max(2, Math.round(fps * 0.05)); // ~50 ms each side

  for (let t = phaseSec; t < maxT; t += period) {
    if (t < minT) continue;
    const idx = Math.round(t * fps);
    let localMax = 0;
    for (let i = Math.max(0, idx - LOOK); i <= Math.min(frames - 1, idx + LOOK); i++) {
      if (nov[i] > localMax) localMax = nov[i];
    }
    if (!started) {
      if (localMax > 0.15) started = true;
      else continue;
    }
    beats.push(t);
  }

  // Fallback if detection failed
  if (beats.length < 4) {
    beats.length = 0;
    for (let t = 1.8; t < Math.min(duration, MAX_ANALYSIS_SECONDS) - 1.5; t += 0.55) beats.push(t);
  }

  // Guarantee a minimum gap
  const minGap = 0.28;
  const out = [];
  for (const b of beats) {
    if (out.length && b - out[out.length - 1] < minGap) continue;
    out.push(b);
  }
  return out;
}

/* ============================================================
   LEVEL
   ============================================================ */
const PALETTE = [0xffc2a1, 0x9fe0c8, 0xa9cdf0, 0xf6c6d8, 0xc9bdf0, 0xf7e0a8];
const WHITE = new THREE.Color(0xffffff);

function buildLevel(beatTimes) {
  const n = beatTimes.length;
  const x = new Float32Array(n), y = new Float32Array(n), z = new Float32Array(n);
  const color = new Uint32Array(n);
  let cz = 0;
  for (let i = 0; i < n; i++) {
    if (i > 0) {
      const dt = Math.min(1.5, beatTimes[i] - beatTimes[i - 1]);
      cz -= Math.max(1.7, Math.min(4.2, dt * 3.1));
    }
    z[i] = cz;
    x[i] = Math.sin(cz * 0.17) * 1.25;
    y[i] = 0.85 + Math.sin(cz * 0.11 + 0.7) * 0.6;
    color[i] = PALETTE[(i * 5) % PALETTE.length];
  }
  return { beats: beatTimes, x, y, z, color, count: n };
}

/* ============================================================
   STATE
   ============================================================ */
const state = {
  mode: 'menu',
  level: null, pIdx: 0,
  songTime: 0, frozenTime: 0, menuTime: 0, startTime: 0,
  airborne: 0, squash: 0, hopProgress: 0,
  audioSrc: null, gainNode: null,
  bpm: 0, buffer: null, camShake: 0,
  songDuration: 0
};
let judged = [], judgePtr = 0;
let score = 0, combo = 0, maxCombo = 0;
let counts = { perfect: 0, good: 0, ok: 0, miss: 0 };

const camTarget = new THREE.Vector3();
const CAM_OFFSET = new THREE.Vector3(6.8, 6.0, 9.6);
const LOOK_OFFSET = new THREE.Vector3(0, 0.5, -3.4);
const _groundPos = new THREE.Vector3();
const _fullPos = new THREE.Vector3();
const _tmpA = new THREE.Vector3();
const _tmpB = new THREE.Vector3();

const smootherstep = t => t * t * t * (t * (t * 6 - 15) + 10);

function getTilePos(i, t, out) {
  const L = state.level;
  out.set(L.x[i], L.y[i] + Math.sin(t * 1.2 + i * 0.7) * 0.06, L.z[i]);
  return out;
}

function buildMenuLevel() {
  const beats = [];
  for (let i = 0; i < 60; i++) beats.push(i * 0.58);
  state.level = buildLevel(beats);
  state.pIdx = 0;
  state.menuTime = 0;
  state.squash = 0;
  camTarget.set(state.level.x[0], state.level.y[0], state.level.z[0]);
  camera.position.copy(camTarget).add(CAM_OFFSET);
}

/* ============================================================
   PLAYER TRANSFORM
   ============================================================ */
function updatePlayerTransform(t) {
  const L = state.level;
  const B = L.beats;
  const i = state.pIdx;
  getTilePos(i, t, _groundPos);

  let p = 0, airborne = 0;

  if (i + 1 < B.length) {
    const interval = Math.max(0.05, B[i + 1] - B[i]);
    const dur = Math.min(0.72, Math.max(0.22, interval * 0.68));
    const jumpStart = B[i + 1] - dur;

    if (t >= jumpStart) {
      p = Math.min(1, Math.max(0, (t - jumpStart) / dur));
      const eased = smootherstep(p);
      getTilePos(i + 1, t, _tmpB);
      _fullPos.copy(_groundPos).lerp(_tmpB, eased);
      const arc = Math.sin(p * Math.PI);
      _fullPos.y += arc * 0.98;
      airborne = arc;
    } else {
      _fullPos.copy(_groundPos);
    }
  } else {
    _fullPos.copy(_groundPos);
  }

  state.airborne = airborne;
  state.hopProgress = p;
  playerGroup.position.copy(_fullPos);

  state.squash += (0 - state.squash) * Math.min(1, 0.016 * 60 * 0.22);
  const stretch = airborne * 0.24;
  let sy = (1 + state.squash) * (1 + stretch);
  sy = Math.max(0.5, Math.min(1.5, sy));
  const sxz = 1 / Math.sqrt(sy);
  playerMesh.scale.set(sxz, sy, sxz);

  const easedP = smootherstep(p);
  playerMesh.rotation.x = -easedP * Math.PI * 2;
  playerMesh.rotation.y += 0.006;

  shadowMesh.position.set(_groundPos.x, _groundPos.y + 0.225, _groundPos.z);
  const h = Math.max(0, _fullPos.y - _groundPos.y);
  const sc = Math.max(0.35, 1 - h * 0.30);
  shadowMesh.scale.setScalar(sc);
  shadowMesh.material.opacity = 0.17 * sc;
}

/* ============================================================
   TILES
   ============================================================ */
function updateTiles(t, dt) {
  for (let s = 0; s < TILE_POOL; s++) tiles[s].visible = false;

  const L = state.level;
  const base = state.pIdx - 4;
  const nextIdx = state.pIdx + 1;

  for (let k = 0; k < TILE_POOL; k++) {
    const idx = base + k;
    if (idx < 0 || idx >= L.count) continue;

    const slot = ((idx % TILE_POOL) + TILE_POOL) % TILE_POOL;
    const m = tiles[slot];
    m.visible = true;

    if (m.userData.idx !== idx) {
      m.userData.idx = idx;
      m.userData.spawn = 0;
    }
    m.userData.spawn = Math.min(1, m.userData.spawn + dt * 3.4);
    const spawnEase = 1 - Math.pow(1 - m.userData.spawn, 3);
    m.scale.setScalar(0.4 + spawnEase * 0.6);

    m.position.set(L.x[idx], L.y[idx] + Math.sin(t * 1.2 + idx * 0.7) * 0.06, L.z[idx]);
    m.material.color.setHex(L.color[idx]);

    if (idx === nextIdx) {
      const pulse = 0.5 + 0.5 * Math.sin(t * 4.6);
      m.material.color.lerp(WHITE, 0.16 + pulse * 0.22);
    } else if (idx === state.pIdx) {
      m.material.color.lerp(WHITE, 0.05);
    }
  }
}

/* ============================================================
   RINGS + CUE
   ============================================================ */
function updateRings(dt) {
  for (const r of rings) {
    if (r.life < 0) continue;
    r.life += dt;
    const d = r.life / 0.7;
    if (d >= 1) { r.life = -1; r.mesh.visible = false; continue; }
    r.mesh.scale.setScalar(0.55 + d * 2.1);
    r.mesh.material.opacity = (1 - d) * 0.5;
  }
}

function updateCueRing() {
  if (state.mode !== 'play' || !state.level) { cueRing.visible = false; return; }
  const L = state.level;
  const i = state.pIdx;
  if (i + 1 >= L.count) { cueRing.visible = false; return; }

  const timeToBeat = L.beats[i + 1] - state.songTime;
  const LOOKAHEAD = 1.6;
  if (timeToBeat > 0 && timeToBeat < LOOKAHEAD) {
    const k = 1 - timeToBeat / LOOKAHEAD;
    const eased = k * k;
    cueRing.position.set(L.x[i + 1], L.y[i + 1] + 0.245, L.z[i + 1]);
    cueRing.scale.setScalar(1.0 - eased * 0.82);
    cueRing.material.opacity = 0.12 + eased * 0.42;
    cueRing.visible = true;
  } else {
    cueRing.visible = false;
  }
}

/* ============================================================
   FEEDBACK / HUD
   ============================================================ */
let fbTimer = null;
function showFeedback(text, cls) {
  feedbackEl.textContent = text;
  feedbackEl.className = '';
  void feedbackEl.offsetWidth;
  feedbackEl.className = 'show f-' + cls;
  clearTimeout(fbTimer);
  fbTimer = setTimeout(() => { feedbackEl.className = ''; }, 620);
}

function updateHUD() {
  scoreEl.textContent = score.toLocaleString();
  if (combo >= 3) { comboEl.textContent = combo + ' COMBO'; comboEl.classList.add('on'); }
  else comboEl.classList.remove('on');
}

/* ============================================================
   JUDGING
   ============================================================ */
function onJudge(kind) {
  if (kind === 'miss') {
    counts.miss++; combo = 0;
    state.squash = 0.20;
    state.camShake = Math.max(state.camShake, 0.012);
    showFeedback('MISS', 'miss');
  } else {
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    counts[kind]++;
    const mult = 1 + Math.floor(combo / 8) * 0.5;
    const base = kind === 'perfect' ? 300 : kind === 'good' ? 150 : 60;
    score += Math.round(base * mult);
    if (kind === 'perfect') {
      showFeedback('PERFECT', 'perfect'); blip(1320, 0.045, 0.09);
      state.camShake = Math.max(state.camShake, 0.018);
    } else if (kind === 'good') {
      showFeedback('GOOD', 'good'); blip(990, 0.032, 0.08);
      state.camShake = Math.max(state.camShake, 0.010);
    } else {
      showFeedback('OK', 'ok');
    }
  }
  updateHUD();
}

function onTap() {
  if (state.mode !== 'play') return;
  const t = state.songTime;
  const B = state.level.beats;
  let best = -1, bestD = 1e9;
  const from = Math.max(0, judgePtr - 1);
  const to = Math.min(B.length, judgePtr + 4);
  for (let i = from; i < to; i++) {
    if (judged[i]) continue;
    const d = Math.abs(B[i] - t);
    if (d < bestD) { bestD = d; best = i; }
  }
  if (best >= 0 && bestD <= 0.28) {
    let kind;
    if (bestD < 0.12) kind = 'perfect';
    else if (bestD < 0.20) kind = 'good';
    else kind = 'ok';
    judged[best] = kind;
    onJudge(kind);
  }
}

/* ============================================================
   FLOW
   ============================================================ */
function showScreen(el) {
  menuEl.classList.add('hidden');
  loadingEl.classList.add('hidden');
  resultsEl.classList.add('hidden');
  if (el) el.classList.remove('hidden');
}
function showLoading(title, sub, progress) {
  loadTitle.textContent = title;
  loadSub.textContent = sub || '';
  barFill.style.width = Math.round((progress || 0) * 100) + '%';
}

function stopPlayback(fadeMs) {
  if (state.gainNode && actx) {
    try { state.gainNode.gain.setTargetAtTime(0, actx.currentTime, fadeMs / 3000); } catch (e) {}
  }
  const src = state.audioSrc;
  state.audioSrc = null;
  if (src) {
    const t = fadeMs;
    setTimeout(() => { try { src.stop(); } catch (e) {} }, t);
  }
}

async function startFromBuffer(buffer) {
  const ctx = await ensureRunning();
  if (!ctx) {
    loadTitle.textContent = 'Audio unavailable';
    loadSub.textContent = 'Your browser blocked audio. Tap the screen and try again.';
    setTimeout(() => { showScreen(menuEl); state.mode = 'menu'; buildMenuLevel(); }, 2200);
    return;
  }

  showScreen(loadingEl);
  hudEl.classList.add('hidden');
  state.mode = 'loading';
  showLoading('Listening', 'Decoding the rhythm', 0.08);
  await nextFrame();

  let analysis;
  try {
    analysis = await analyzeBuffer(buffer, (p, msg) => showLoading('Listening', msg, p));
  } catch (e) {
    console.error('Analysis failed:', e);
    analysis = { beats: [], bpm: 110 };
  }

  let beats = analysis.beats.slice();
  const duration = buffer.duration;

  // Extend grid past the analysis window for long songs
  if (duration > MAX_ANALYSIS_SECONDS - 4 && beats.length > 4) {
    const period = 60 / Math.max(60, analysis.bpm);
    let t = beats[beats.length - 1] + period;
    while (t < duration - 1.2) { beats.push(t); t += period; }
  }

  if (beats.length < 4) {
    beats = [];
    for (let t = 1.8; t < Math.min(duration, MAX_ANALYSIS_SECONDS) - 1.5; t += 0.55) beats.push(t);
    analysis.bpm = 110;
  }

  state.bpm = analysis.bpm;
  state.buffer = buffer;
  state.songDuration = duration;
  state.level = buildLevel(beats);
  state.pIdx = 0;
  state.squash = 0;

  score = 0; combo = 0; maxCombo = 0;
  counts = { perfect: 0, good: 0, ok: 0, miss: 0 };
  judged = new Array(state.level.beats.length).fill(null);
  judgePtr = 0;
  updateHUD();

  // Make sure nothing is playing
  stopPlayback(0);

  // Make sure the context is running RIGHT BEFORE we schedule
  await ensureRunning();

  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const g = ctx.createGain();
  g.gain.value = 1.0;
  src.connect(g).connect(ctx.destination);

  const lead = 0.65;
  const when = ctx.currentTime + lead;
  try {
    src.start(when);
  } catch (e) {
    console.error('src.start failed', e);
    loadTitle.textContent = 'Playback failed';
    loadSub.textContent = 'Please try again.';
    setTimeout(() => { showScreen(menuEl); state.mode = 'menu'; buildMenuLevel(); }, 2200);
    return;
  }

  src.onended = () => {
    if (state.mode === 'play' && state.audioSrc === src) {
      // song ended naturally
      endGame();
    }
  };

  state.audioSrc = src;
  state.gainNode = g;
  state.startTime = when;
  state.songTime = -lead;
  camTarget.set(state.level.x[0], state.level.y[0], state.level.z[0]);

  bpmTag.textContent = analysis.bpm + ' BPM';

  showScreen(null);
  hudEl.classList.remove('hidden');
  tapHint.style.opacity = '1';
  setTimeout(() => { tapHint.style.opacity = '0'; }, 3600);

  state.mode = 'play';
}

function endGame() {
  if (state.mode !== 'play') return;
  state.mode = 'results';
  state.frozenTime = state.songTime;
  stopPlayback(1400);
  hudEl.classList.add('hidden');

  const total = counts.perfect + counts.good + counts.ok + counts.miss;
  const acc = total ? (counts.perfect * 1 + counts.good * 0.7 + counts.ok * 0.4) / total : 0;

  $('rScore').textContent = score.toLocaleString();
  $('rStats').innerHTML = `
    <div class="stat wide"><b>${Math.round(acc * 100)}%</b>ACCURACY</div>
    <div class="stat"><b style="color:#e96848">${counts.perfect}</b>PERFECT</div>
    <div class="stat"><b style="color:#4fb8a0">${counts.good}</b>GOOD</div>
    <div class="stat"><b style="color:#8a8ab0">${counts.ok}</b>OK</div>
    <div class="stat wide"><b>${maxCombo}</b>BEST COMBO</div>
  `;
  showScreen(resultsEl);
}

function replay() { if (state.buffer) startFromBuffer(state.buffer); }

function backToMenu() {
  state.mode = 'menu';
  state.buffer = null;
  stopPlayback(200);
  hudEl.classList.add('hidden');
  buildMenuLevel();
  showScreen(menuEl);
}

/* ============================================================
   DEMO TRACK
   ============================================================ */
async function makeDemoBuffer() {
  const ctx = createAudioContext();
  if (!ctx) throw new Error('No audio');
  const sr = ctx.sampleRate;
  const DUR = 46, BPM = 88;
  const spb = 60 / BPM;

  const off = new OfflineAudioContext(2, Math.floor(sr * DUR), sr);
  const master = off.createGain(); master.gain.value = 0.82;
  const comp = off.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 22; comp.ratio.value = 5;
  comp.attack.value = 0.006; comp.release.value = 0.28;
  master.connect(comp).connect(off.destination);

  const noiseBuf = off.createBuffer(1, Math.floor(sr * 0.4), sr);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  function kick(t, amp) {
    const o = off.createOscillator(); o.type = 'sine';
    const g = off.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amp, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.5);
  }
  function hat(t, amp) {
    const s = off.createBufferSource(); s.buffer = noiseBuf;
    const f = off.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7200;
    const g = off.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amp, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.065);
    s.connect(f).connect(g).connect(master);
    s.start(t); s.stop(t + 0.12);
  }
  function pad(t, dur, freqs, amp) {
    const f = off.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1700; f.Q.value = 0.4;
    const g = off.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(amp, t + 0.9);
    g.gain.setValueAtTime(amp, t + dur - 0.9);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    f.connect(g).connect(master);
    for (const fr of freqs) for (const det of [-5, 5]) {
      const o = off.createOscillator(); o.type = 'triangle';
      o.frequency.value = fr; o.detune.value = det;
      o.connect(f); o.start(t); o.stop(t + dur + 0.05);
    }
  }
  function bass(t, dur, freq, amp) {
    const o = off.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
    const g = off.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(amp, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }

  const prog = [
    { root: 220.00, chord: [220.00, 261.63, 329.63] },
    { root: 174.61, chord: [174.61, 220.00, 261.63] },
    { root: 196.00, chord: [196.00, 246.94, 293.66] },
    { root: 261.63, chord: [261.63, 329.63, 392.00] }
  ];

  const barLen = spb * 4;
  const bars = Math.floor((DUR - 2.5) / barLen);
  const t0 = 1.2;

  for (let b = 0; b < bars; b++) {
    const bt = t0 + b * barLen;
    const ch = prog[b % prog.length];
    pad(bt, barLen, ch.chord, 0.085);
    for (let k = 0; k < 4; k++) {
      const t = bt + k * spb;
      kick(t, k === 0 ? 0.92 : 0.68);
      bass(t, spb * 0.9, ch.root / 2, 0.22);
      if (k % 2 === 1) hat(t, 0.09);
      hat(t + spb * 0.5, 0.045);
    }
  }

  return await off.startRendering();
}

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;

  // CRITICAL: unlock audio inside this user gesture
  await unlockAudio();
  const ctx = await ensureRunning();
  if (!ctx) {
    e.target.value = '';
    loadTitle.textContent = 'Audio unavailable';
    loadSub.textContent = 'Tap the screen and try again.';
    showScreen(loadingEl);
    setTimeout(() => { showScreen(menuEl); state.mode = 'menu'; }, 2200);
    return;
  }

  showScreen(loadingEl);
  hudEl.classList.add('hidden');
  state.mode = 'loading';
  showLoading('Loading', `Reading "${file.name}"`, 0.05);
  await nextFrame();

  try {
    // Read file — keep a copy for retry
    const raw = await file.arrayBuffer();
    const copy = raw.slice(0);

    showLoading('Decoding', 'Unpacking the audio…', 0.12);
    await nextFrame();

    let buf = null;
    try {
      buf = await ctx.decodeAudioData(raw);
    } catch (err1) {
      console.warn('First decode failed, retrying copy…', err1);
      try { buf = await ctx.decodeAudioData(copy); }
      catch (err2) { throw err2; }
    }
    if (!buf || !buf.length) throw new Error('Empty audio buffer');

    await startFromBuffer(buf);
  } catch (err) {
    console.error('File load error:', err);
    loadTitle.textContent = 'Could not read that file';
    let msg = 'Try an mp3, m4a, or wav file from your library.';
    const name = (file.name || '').toLowerCase();
    if (name.endsWith('.m4p')) msg = 'That file looks protected. Try a non-DRM track.';
    else if (name.endsWith('.flac') || name.endsWith('.ogg')) msg = 'That format may not be supported. Try mp3, m4a or wav.';
    loadSub.textContent = msg;
    barFill.style.width = '0%';
    setTimeout(() => { showScreen(menuEl); state.mode = 'menu'; buildMenuLevel(); }, 2400);
  } finally {
    e.target.value = '';
  }
});

  await unlockAudio();
  const ctx = await ensureRunning();
  if (!ctx) return;

  showScreen(loadingEl);
  hudEl.classList.add('hidden');
  state.mode = 'loading';
  showLoading('Composing', 'Building a gentle demo track', 0.15);

});

}
onResize();

/* ============================================================
   MAIN LOOP
   ============================================================ */
let lastTime = performance.now();
let worldTime = 0;

function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  worldTime += dt;

  let t = 0;

  if (state.mode === 'menu') {
    state.menuTime += dt;
    t = state.menuTime;
    const L = state.level;
    if (L) {
      while (state.pIdx + 1 < L.beats.length && t >= L.beats[state.pIdx + 1]) {
        state.pIdx++;
        state.squash = -0.32;
        getTilePos(state.pIdx, t, _tmpA);
        spawnRing(_tmpA, false);
      }
      if (state.pIdx >= L.beats.length - 1) {
        state.pIdx = 0; state.menuTime = 0; t = 0;
        camTarget.set(L.x[0], L.y[0], L.z[0]);
      }
      updatePlayerTransform(t);
      updateTiles(t, dt);
    }
    cueRing.visible = false;
  } else if (state.mode === 'play') {
    if (!actx) { t = 0; }
    else t = actx.currentTime - state.startTime;
    state.songTime = t;
    const L = state.level;

    while (judgePtr < L.beats.length && t > L.beats[judgePtr] + 0.28) {
      if (!judged[judgePtr]) { judged[judgePtr] = 'miss'; onJudge('miss'); }
      judgePtr++;
    }
    while (state.pIdx + 1 < L.beats.length && t >= L.beats[state.pIdx + 1]) {
      state.pIdx++;
      state.squash = -0.40;
      getTilePos(state.pIdx, t, _tmpA);
      const kind = judged[state.pIdx];
      spawnRing(_tmpA, kind === 'perfect' || kind === 'good');
    }

    updatePlayerTransform(t);
    updateTiles(t, dt);
    updateCueRing();

    if (t > L.beats[L.beats.length - 1] + 2.8) endGame();
  } else if (state.mode === 'results') {
    t = state.frozenTime;
    if (state.level) { updateTiles(t, dt); updatePlayerTransform(t); }
    cueRing.visible = false;
  } else {
    if (state.level) updateTiles(worldTime, dt);
    cueRing.visible = false;
  }

  updateRings(dt);

  // Ambient particles
  particleGroup.position.set(camTarget.x * 0.6, 0, camTarget.z * 0.6);
  for (const p of particles) {
    p.position.y = p.userData.baseY + Math.sin(worldTime * p.userData.speed + p.userData.phase) * p.userData.amp;
    p.position.x += Math.sin(worldTime * 0.2 + p.userData.phase) * dt * 0.12;
  }

  // Camera follow
  if (state.level) {
    const k = 1 - Math.exp(-dt * 3.6);
    camTarget.x += (_groundPos.x - camTarget.x) * k;
    camTarget.y += (_groundPos.y - camTarget.y) * k;
    camTarget.z += (_groundPos.z - camTarget.z) * k;

    _tmpA.copy(camTarget).add(CAM_OFFSET);
    if (state.mode === 'menu') {
      _tmpA.x += Math.sin(worldTime * 0.22) * 0.85;
      _tmpA.y += Math.sin(worldTime * 0.35) * 0.30;
    }
    camera.position.lerp(_tmpA, 1 - Math.exp(-dt * 4.2));

    state.camShake *= Math.exp(-dt * 7.5);
    if (state.camShake > 0.0005) {
      camera.position.x += Math.sin(worldTime * 46) * state.camShake;
      camera.position.y += Math.cos(worldTime * 39) * state.camShake;
    }

    _tmpB.copy(camTarget).add(LOOK_OFFSET);
    camera.lookAt(_tmpB);
  }

  renderer.render(scene, camera);
}

/* ============================================================
   BOOT
   ============================================================ */
buildMenuLevel();
showScreen(menuEl);
requestAnimationFrame(tick);
</script>
