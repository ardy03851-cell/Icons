<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calyx Studio</title>

  <link rel="icon" href="web.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --bg-canvas: #030508;
      --text-primary: #ECEFF4;
      --text-muted: #7E8D9F;

      --glass-bg: rgba(10, 15, 25, 0.65);
      --glass-border: rgba(41, 98, 255, 0.15);

      --thorn-blue-deep: #002266;
      --thorn-blue-bright: #2962FF;
      --thorn-cyan: #00E5FF;

      --rose-accent: #1E3A8A;
      --rose-glow: #3B82F6;

      --font-serif: 'Cinzel', serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
    }

    .ambient-mesh {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background:
        radial-gradient(circle at 10% 20%, rgba(41, 98, 255, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(0, 229, 255, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(30, 58, 138, 0.1) 0%, transparent 60%);
      filter: blur(80px);
      pointer-events: none;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 16px;
      gap: 16px;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .sidebar {
      width: 340px;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding: 0 8px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(41, 98, 255, 0.4);
      box-shadow: 0 0 15px rgba(41, 98, 255, 0.3);
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #FFFFFF, var(--thorn-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 16px;
      padding: 0 8px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--thorn-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--thorn-cyan);
    }

    .model-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      flex: 1;
      padding: 4px;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(41, 98, 255, 0.2);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(41, 98, 255, 0.4);
    }

    .provider-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .provider-header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--thorn-cyan);
      padding: 0 8px;
      font-weight: 600;
      opacity: 0.8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .model-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .model-card:hover {
      background: rgba(41, 98, 255, 0.05);
      border-color: rgba(41, 98, 255, 0.25);
    }

    .model-card.active {
      background: rgba(41, 98, 255, 0.08);
      border-color: var(--thorn-bright, #2962FF);
      box-shadow:
        0 0 20px rgba(41, 98, 255, 0.25),
        inset 0 0 12px rgba(0, 229, 255, 0.1);
    }

    .model-icon-wrapper {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .model-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
      border-radius: 4px;
    }

    .model-card.active .model-icon-wrapper {
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
      border-color: var(--thorn-cyan);
    }

    .model-info {
      flex: 1;
      min-width: 0;
    }

    .model-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      font-size: 8px;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(41, 98, 255, 0.15);
      color: var(--thorn-cyan);
      border: 1px solid rgba(41, 98, 255, 0.3);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .model-card.active .badge {
      background: rgba(0, 229, 255, 0.15);
      color: #FFFFFF;
      border: 1px solid rgba(0, 229, 255, 0.5);
    }

    .model-id-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .workspace-header {
      padding: 22px 24px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 5, 8, 0.3);
    }

    .current-model-display {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .current-model-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(41, 98, 255, 0.3);
      background: rgba(0, 0, 0, 0.6);
      padding: 6px;
      object-fit: contain;
      box-shadow: 0 0 15px rgba(41, 98, 255, 0.2);
    }

    .current-model-text h2 {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 3px;
      letter-spacing: 0.5px;
    }

    .current-model-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .chat-area {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      display: flex;
      gap: 14px;
      max-width: 85%;
    }

    .message.ai {
      align-self: flex-start;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      flex-shrink: 0;
    }

    .avatar img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .message-bubble {
      padding: 14px 18px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      line-height: 1.6;
      font-size: 14px;
    }

    .message.user .message-bubble {
      background: rgba(41, 98, 255, 0.08);
      border-color: rgba(41, 98, 255, 0.3);
      border-bottom-right-radius: 4px;
    }

    .message.ai .message-bubble {
      background: rgba(0, 34, 102, 0.15);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-bottom-left-radius: 4px;
      box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.03);
    }

    .input-region {
      padding: 20px 24px 24px 24px;
      position: relative;
    }

    .input-glass-container {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      background: rgba(5, 8, 15, 0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(41, 98, 255, 0.2);
      border-radius: 20px;
      padding: 12px 16px;
      transition: all 0.3s ease;
    }

    .input-glass-container.focused {
      border-color: var(--thorn-cyan);
      box-shadow:
        0 0 25px rgba(0, 229, 255, 0.25),
        inset 0 0 15px rgba(41, 98, 255, 0.15);
    }

    .input-glass-container textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      resize: none;
      height: 42px;
      max-height: 150px;
      line-height: 22px;
      padding: 10px 0;
    }

    .input-glass-container textarea:focus {
      outline: none;
    }

    .input-glass-container textarea::placeholder {
      color: rgba(126, 141, 159, 0.5);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--thorn-blue-bright), var(--thorn-cyan));
      color: #030508;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(41, 98, 255, 0.4);
      transition: all 0.2s ease;
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.6);
    }

    .send-btn i {
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="ambient-mesh"></div>

  <div class="app-container">

    <aside class="glass-panel sidebar">
      <div class="brand-header">
        <img src="web.png" alt="Calyx" class="brand-logo">
        <div class="brand-title">Calyx Studio</div>
      </div>

      <h2 class="section-title">Thorn Matrix</h2>

      <div id="model-list" class="model-list">
      </div>
    </aside>

    <main class="glass-panel workspace">
      <header class="workspace-header">
        <div class="current-model-display" id="current-model-header">
        </div>

        <div style="display: flex; gap: 12px;">
          <div class="avatar"><i class="ph ph-sliders text-muted"></i></div>
        </div>
      </header>

      <div class="chat-area" id="chat-area">
        <div class="message ai">
          <div class="avatar" id="chat-ai-avatar">
            <i class="ph ph-flower-lotus" style="color: var(--thorn-cyan)"></i>
          </div>
          <div class="message-bubble">
            Calyx network active. Select a model variant from the thorn matrix to deploy intelligence parameters.
          </div>
        </div>
      </div>

      <div class="input-region">
        <div class="input-glass-container" id="input-wrapper">
          <i class="ph ph-plant" style="color: rgba(41, 98, 255, 0.5); font-size: 20px; padding-bottom: 10px;"></i>
          <textarea id="prompt-input" placeholder="Inject instructions or execute query..."></textarea>
          <button class="send-btn">
                        <i class="ph ph-arrow-up"></i>
                    </button>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { models } from './models.js';

        // Safe unique fallback identification using index and id
        let currentModel = models[0];

        const modelListEl = document.getElementById('model-list');
        const headerEl = document.getElementById('current-model-header');
        const aiAvatarEl = document.getElementById('chat-ai-avatar');

        function renderModels() {
            modelListEl.innerHTML = '';
            
            // Group models dynamically by provider to handle multiple models from the same company seamlessly
            const groupedModels = {};
            models.forEach((model, index) => {
                const providerKey = model.provider || "General";
                if (!groupedModels[providerKey]) {
                    groupedModels[providerKey] = [];
                }
                // Attach unique reference index to safeguard against identical IDs/keys
                groupedModels[providerKey].push({ ...model, _globalIndex: index });
            });

            Object.keys(groupedModels).forEach(provider => {
                const groupContainer = document.createElement('div');
                groupContainer.className = 'provider-group';

                const groupHeader = document.createElement('div');
                groupHeader.className = 'provider-header';
                groupHeader.innerHTML = `<i class="ph ph-git-commit" style="font-size: 10px;"></i> ${provider}`;
                groupContainer.appendChild(groupHeader);

                groupedModels[provider].forEach(model => {
                    const isSelected = currentModel._globalIndex === model._globalIndex;
                    const card = document.createElement('div');
                    card.className = `model-card ${isSelected ? 'active' : ''}`;
                    
                    card.innerHTML = `
                        <div class="model-icon-wrapper">
                            <img src="${model.logoUrl}" class="model-icon" alt="${model.provider}">
                        </div>
                        <div class="model-info">
                            <div class="model-name">
                                <span>${model.name}</span>
                                <span class="badge">${model.badge || 'Ready'}</span>
                            </div>
                            <div class="model-id-sub">${model.id}</div>
                        </div>
                    `;
                    
                    card.addEventListener('click', () => {
                        currentModel = model;
                        renderModels();
                        updateWorkspace();
                    });
                    
                    groupContainer.appendChild(card);
                });

                modelListEl.appendChild(groupContainer);
            });
        }

        function updateWorkspace() {
            headerEl.innerHTML = `
                <img src="${currentModel.logoUrl}" class="current-model-icon" alt="${currentModel.name}">
                <div class="current-model-text">
                    <h2>${currentModel.name}</h2>
                    <p>${currentModel.description || currentModel.id}</p>
                </div>
            `;
            
            aiAvatarEl.innerHTML = `<img src="${currentModel.logoUrl}" alt="${currentModel.name}">`;
        }

        const textarea = document.getElementById('prompt-input');
        const inputWrapper = document.getElementById('input-wrapper');

        textarea.addEventListener('focus', () => {
            inputWrapper.classList.add('focused');
        });

        textarea.addEventListener('blur', () => {
            inputWrapper.classList.remove('focused');
        });

        if(models && models.length > 0) {
            // Assign default tracking index to initial model
            currentModel = { ...models[0], _globalIndex: 0 };
            renderModels();
            updateWorkspace();
        }
  </script>
</body>

</html>
